name: General workflows

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'agent/**'
      - 'db/**'
      - 'server/**'
      - 'workproduct/**'
      - 'web/**'
      - '.github/workflows/general-workflows.yml'

concurrency:
  group: general-workflows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: artex_test
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex_test@localhost:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile all packages
        run: go test ./... -run TestNonexistent -count=1
      - name: General workflows and collaboration regressions with PostgreSQL
        run: go test -race -p 1 ./workproduct ./db ./agent ./server -run 'TestGeneral|TestTeam|TestFactNotice' -count=1 -v
      - name: Task cancellation compatibility
        run: go test -race ./server -run 'TestPauseCancels|TestKillWorkCancels|TestControlWorkCarries' -count=1
      - name: Static analysis
        run: go vet ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
