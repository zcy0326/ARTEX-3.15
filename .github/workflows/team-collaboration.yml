name: Team collaboration tests

on:
  push:
    branches: [codex/team-knowledge-handoffs]
  pull_request:
    paths:
      - 'agent/**'
      - 'db/**'
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/team-collaboration.yml'

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.revision == 'baseline' }}
    strategy:
      fail-fast: false
      matrix:
        revision: [head, baseline]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: artex_test
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex_test@localhost:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && (github.event.pull_request.base.sha || 'a3755846ca8bcf01687e1bb7dc6ed4a86d2f29e1') || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Focused collaboration integration tests
        if: matrix.revision == 'head'
        run: go test -race -p 1 ./agent ./db ./server -run 'TestTeam|TestFactNotice' -count=1 -v
      - name: Full race and PostgreSQL suite
        run: go test -race -p 1 ./agent ./db ./server -count=1
