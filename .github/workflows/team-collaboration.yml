name: Team collaboration tests

on:
  push:
    branches: [codex/team-knowledge-handoffs]
  pull_request:
    paths:
      - 'agent/**'
      - 'db/**'
      - 'server/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/team-collaboration.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: artex_test
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex_test@localhost:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race and PostgreSQL integration tests
        run: go test -race -p 1 ./agent ./db ./server -count=1
